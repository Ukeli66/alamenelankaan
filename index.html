<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Älä mene lankaan!</title><style>
:root{--bg:#07111f;--panel:#102238;--text:#f4f8fc;--muted:#b9c8d8;--cyan:#55c9ff;--green:#54d68b;--red:#ff6b6b;--amber:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173657,#07111f 55%);color:var(--text);font:18px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{width:min(850px,calc(100% - 28px));margin:auto;padding:26px 0 50px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.04em}.progress{color:var(--muted)}.bar{height:10px;background:#253a50;border-radius:9px;overflow:hidden;margin:12px 0 20px}.bar>div{height:100%;background:var(--cyan);transition:width .25s}.card{background:rgba(16,34,56,.97);border:1px solid #385675;border-radius:18px;padding:clamp(20px,4vw,38px);box-shadow:0 14px 50px #0007}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.05;margin:.2em 0}h2{line-height:1.2;margin-top:0}.lead{font-size:1.15rem;color:#ddeafb}.message{background:#f7f9fc;color:#14202e;border-radius:12px;padding:18px;margin:18px 0;box-shadow:inset 5px 0 var(--amber)}.meta{font-size:.9rem;color:#415264;border-bottom:1px solid #cad3dc;padding-bottom:10px}.choices{display:grid;gap:12px;margin-top:22px}button,a.btn{display:block;width:100%;text-align:left;border:2px solid #4b6b8a;background:#16304c;color:white;border-radius:12px;padding:15px 17px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}button:hover,button:focus-visible,a.btn:hover,a.btn:focus-visible{border-color:var(--cyan);outline:3px solid #55c9ff55;outline-offset:2px}button.primary{background:#0879a9;border-color:#68dafc;text-align:center}button.secondary,a.secondary{background:transparent;text-align:center}.feedback{border-left:6px solid var(--amber);background:#192f47;padding:17px;margin:18px 0;border-radius:8px}.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}.meters{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.96rem}.meter strong{color:white}.hint{background:#132b43;border:1px dashed #6f91b1;padding:14px;border-radius:10px;margin-top:14px}.tag{display:inline-block;border:1px solid #6d8baa;border-radius:999px;padding:3px 10px;color:#d8e8f5;font-size:.85rem}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.summary>div{background:#142b43;padding:15px;border-radius:12px}@media(max-width:520px){body{font-size:16px}.summary{grid-template-columns:1fr}.card{padding:20px}.meters{gap:10px}}
</style></head><body><main><div class="top"><div class="brand">ÄLÄ MENE LANKAAN!</div><div id="progressText" class="progress"></div></div><div class="bar" aria-hidden="true"><div id="progressBar"></div></div><section id="app" class="card" aria-live="polite"></section></main><script>
const cases=[
{title:'Tilisi suljetaan tänään',type:'Sähköposti',body:'<div class="meta"><b>Lähettäjä:</b> Opiskelijapalvelut &lt;tuki@opiskelija-varmistus.example&gt;</div><p><b>TÄRKEÄ ILMOITUS!</b></p><p>Opiskelijatunnuksesi suljetaan tänään klo 18.00. Vahvista tunnuksesi välittömästi, jotta palvelut toimivat.</p><p>[ VAHVISTA TUNNUS ]</p>',hint:'Vertaa lähettäjän osoitetta oppilaitoksen tavalliseen osoitteeseen. Mieti myös, mihin linkki veisi.',choices:[
['Avaan linkin ja kirjoitan tunnukseni.','bad',-25,-12,'Sivu näyttää tutulta, mutta osoite poikkeaa oikeasta. Tunnukset päätyvät huijarille.','repairCred'],
['Vastaan viestiin ja kysyn, onko ilmoitus oikea.','mid',-5,-3,'Vastaus menee samalle lähettäjälle. Huijari voi jatkaa painostamista. Aitoutta ei vahvistettu.'],
['Avaan oppilaitoksen palvelun itse tallennetusta osoitteesta ja tarkistan tilanteen.','good',10,12,'Tilillä ei ole ongelmaa. Tarkistit asian riippumattomasta ja tutusta kanavasta.']]},
{title:'Pakettisi odottaa',type:'Tekstiviesti',body:'<p>Pakettiasi ei voitu toimittaa. Maksa 1,95 € uudelleentoimituksesta kahden tunnin aikana.</p><p>[ MAKSA TOIMITUS ]</p><p><small>Odotat oikeasti verkkokauppatilausta.</small></p>',hint:'Todellinen tilaus tekee viestistä uskottavan. Mistä näet toimituksen tilanteen ilman viestin linkkiä?',choices:[
['Maksan, koska summa on pieni ja odotan pakettia.','bad',-22,-10,'Pieni maksu toimii syöttinä. Maksusivu kerää kortin numeron, voimassaoloajan ja turvakoodin.','repairCard'],
['Tarkistan tilauksen verkkokaupan tai kuljetusyrityksen omasta palvelusta.','good',10,12,'Paketti on normaalisti kuljetuksessa. Viestin linkkiä ei tarvittu.'],
['Kysyn kaverilta, näyttääkö viesti aidolta.','mid',0,-2,'Toinen mielipide voi auttaa, mutta kaverikaan ei pysty vahvistamaan toimituksen tilaa.']]},
{title:'Voitit uuden puhelimen',type:'Sosiaalisen median ilmoitus',body:'<p><b>ONNEKSI OLKOON!</b></p><p>Sinut on valittu uuden puhelimen voittajaksi. Lunasta palkinto 10 minuutissa.</p><p>Anna nimi, osoite ja maksukortin tiedot toimitusta varten.</p><p><small>Kommenteissa moni kertoo saaneensa palkinnon.</small></p>',hint:'Kommentit, tykkäykset ja kiire voidaan lavastaa. Oletko osallistunut arvontaan, ja löytyykö arvonta järjestäjän omasta kanavasta?',choices:[
['Täytän tiedot. Toimituksesta voidaan periä pieni maksu.','bad',-22,-12,'Palkintoa ei tule. Henkilö- ja korttitiedot voivat päätyä väärinkäyttöön.','repairCard'],
['Tarkistan järjestäjän virallisen sivun ja arvonnan ehdot.','good',10,12,'Arvontaa ei löydy viralliselta sivulta. Tarkistit väitteen lähteestä, jota ilmoituksen tekijä ei hallitse.'],
['Luotan kommentteihin, koska niitä on paljon.','bad',-10,-8,'Kommentit voivat olla tekaistuja tai kaapattujen tilien julkaisemia. Suosio ei todista aitoutta.']]},
{title:'Kaveri tarvitsee rahaa',type:'Pikaviesti uudesta numerosta',body:'<p>Moi! Mun puhelin hajosi ja käytän nyt toista numeroa. Tarvitsisin nopeasti 40 €. Voitko siirtää rahat? Maksan huomenna takaisin.</p><p><small>Viestissä käytetään tutun nimeä ja tuttua kirjoitustyyliä.</small></p>',hint:'Miten voit varmistaa henkilön toisella yhteystavalla, jota viestin lähettäjä ei hallitse?',choices:[
['Siirrän rahat, koska summa ei ole suuri.','bad',-20,-10,'Rahat menevät huijarille. Nimi ja kirjoitustyyli oli voitu kopioida sosiaalisesta mediasta.','repairMoney'],
['Kysyn viestissä asian, jonka vain tuttu tietää.','mid',0,2,'Tämä voi auttaa, mutta verkosta löytyvä tieto ei ole hyvä varmistus. Toinen yhteyskanava on vahvempi.'],
['Soitan tutun aiemmin käyttämääni numeroon.','good',10,12,'Tuttu ei ole pyytänyt rahaa. Varmistit henkilön riippumattomalla yhteyskanavalla.']]},
{title:'Ilmainen pelilahja',type:'Peliyhteisön julkaisu',body:'<p>Saat harvinaisen peliesineen ilmaiseksi! Tarjous on voimassa vain tänään.</p><p>Kirjaudu pelitilillesi lunastaaksesi lahjan.</p><p><small>Linkkiä on jaettu useilla pelikanavilla.</small></p>',hint:'Linkin yleisyys ei tee siitä turvallista. Missä aito etu näkyisi?',choices:[
['Kirjaudun linkin kautta. Sivu näyttää oikealta.','bad',-25,-12,'Ulkoasu on kopioitu. Kirjautumistiedot päätyvät huijarille.','repairGame'],
['Tarkistan tarjouksen pelipalvelun omasta sovelluksesta.','good',10,12,'Tarjousta ei löydy palvelusta. Et käyttänyt julkaisun tarjoamaa kirjautumisreittiä.'],
['Avaan linkin, mutta en kirjaudu ennen kuin näen sivun.','mid',-4,1,'Pelkkä avaaminen ei aina aiheuta vahinkoa, mutta huijaussivu voi painostaa tai yrittää ohjata lataukseen. Turvallisempi reitti on oma sovellus.']]},
{title:'Viimeinen testi',type:'Kolme ilmoitusta',body:'<p><b>1.</b> Oppilaitoksen verkkopalvelussa on huoltokatko huomenna. Lisätiedot oppilaitoksen verkkosivuilla.</p><p><b>2.</b> Maksukorttisi on lukittu. Vahvista henkilöllisyytesi heti tästä linkistä.</p><p><b>3.</b> Pelipalvelun salasanasi vaihdettiin. Jos et tehnyt muutosta, tarkista tilisi turvallisuus palvelun omasta sovelluksesta.</p>',hint:'Kaikkea ei voi ratkaista tekstistä. Valitse toimintatapa, joka ei luota viestin omaan linkkiin.',choices:[
['Avaan kaikki linkit ja arvioin sivut silmämääräisesti.','bad',-18,-10,'Sivun ulkoasu ei todista aitoutta. Kaikkien linkkien avaaminen kasvattaa riskiä.'],
['Poistan kaikki viestit avaamatta mitään.','mid',0,-2,'Vältit linkit, mutta mahdollinen tilimuutos jäi tarkistamatta. Turvallisuusilmoitus kannattaa tarkistaa palvelusta.'],
['Tarkistan huoltokatkon oppilaitoksen sivulta sekä kortin ja pelitilin niiden omista palveluista.','good',12,14,'Et ratkaissut aitoutta pelkän tekstin perusteella. Tarkistit jokaisen asian luotettavaa reittiä.']]}];
const repairs={repairCred:{q:'Tunnukset annettiin epäilyttävälle sivulle. Mikä tehdään ensin?',a:[['Poistan viestin ja odotan.','Tietojen poistaminen omasta näkymästä ei estä tunnusten käyttöä.',-8],['Vaihdan salasanan aidossa palvelussa, kirjaan muut istunnot ulos ja ilmoitan IT-tukeen.','Näin rajoitat vahinkoa. Jos sama salasana on muualla, vaihda se myös siellä.',8]]},repairCard:{q:'Korttitiedot annettiin epäilyttävälle sivulle. Mikä tehdään nyt?',a:[['Seuraan tiliä muutaman päivän.','Odottaminen antaa väärinkäytölle aikaa.',-8],['Otan heti yhteyttä pankin sulkupalveluun ja seuraan tapahtumia.','Kortti voidaan sulkea ja epäilyttävät tapahtumat käsitellä pankin ohjeiden mukaan.',8]]},repairMoney:{q:'Raha siirrettiin huijarille. Mikä on paras seuraava toiminta?',a:[['Poistan keskustelun.','Keskustelu ja maksutiedot ovat tarpeellisia selvittämisessä.',-8],['Otan heti yhteyttä pankkiin, säilytän tiedot ja teen rikosilmoituksen.','Nopea yhteydenotto voi auttaa. Tiedot tukevat asian selvittämistä.',8]]},repairGame:{q:'Pelitilin tunnukset annettiin huijaussivulle. Mitä teet?',a:[['Vaihdan salasanan, kirjaan muut istunnot ulos ja otan monivaiheisen tunnistautumisen käyttöön.','Nämä toimet suojaavat tiliä. Tarvittaessa käytä palvelun tilinpalautusta.',8],['Odotan, näkyykö tilillä muutoksia.','Odottaminen voi antaa kaappaajalle aikaa muuttaa tilin tietoja.',-8]]}};
let state={i:-1,safety:50,attention:50,good:0,mistakes:0,hints:0,locked:false};const app=document.querySelector('#app');
function clamp(n){return Math.max(0,Math.min(100,n))}function meters(){return `<div class="meters"><span class="meter">🛡️ Turvallisuus <strong>${state.safety}/100</strong></span><span class="meter">🔎 Tarkkaavaisuus <strong>${state.attention}/100</strong></span></div>`}function progress(){const n=Math.max(0,state.i);document.querySelector('#progressText').textContent=state.i<0?'Haastava versio':state.i<cases.length?`Tapaus ${state.i+1}/${cases.length}`:'Yhteenveto';document.querySelector('#progressBar').style.width=`${state.i<0?0:Math.min(100,(n/cases.length)*100)}%`}
function start(){state={i:0,safety:50,attention:50,good:0,mistakes:0,hints:0,locked:false};renderCase()}
function intro(){progress();app.innerHTML=`<span class="tag">Haastava versio</span><h1>Älä mene lankaan!</h1><p class="lead">Tunnistatko huijauksen, kun viesti näyttää uskottavalta?</p><p>Kohtaat kuusi tilannetta. Mukana on myös tavallisia ilmoituksia. Kaikkea ei voi päätellä viestin ulkoasusta.</p><ul><li>Pysähdy ennen toimintaa.</li><li>Tarkista asia riippumattomasta lähteestä.</li><li>Jos teet virheen, rajoita vahinko.</li></ul><p>Pelissä ei ole aikarajaa eikä siinä kysytä oikeita tietojasi.</p><button class="primary" onclick="start()">Aloita peli</button>`}
function renderCase(){progress();const c=cases[state.i];app.innerHTML=`${meters()}<p class="tag">${c.type}</p><h2>${c.title}</h2><div class="message">${c.body}</div><button class="secondary" id="hintBtn">Näytä vihje</button><div id="hint"></div><div class="choices">${c.choices.map((x,j)=>`<button data-choice="${j}">${x[0]}</button>`).join('')}</div>`;document.querySelector('#hintBtn').onclick=()=>{state.hints++;document.querySelector('#hint').innerHTML=`<div class="hint"><b>Vihje:</b> ${c.hint}</div>`;document.querySelector('#hintBtn').disabled=true};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice))}
function choose(j){if(state.locked)return;state.locked=true;const c=cases[state.i],x=c.choices[j];state.safety=clamp(state.safety+x[2]);state.attention=clamp(state.attention+x[3]);if(x[1]==='good')state.good++;else state.mistakes++;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);const cls=x[1]==='good'?'good':x[1]==='bad'?'bad':'';const label=x[1]==='good'?'Toimiva ratkaisu':x[1]==='bad'?'Riskialtis ratkaisu':'Osittain toimiva ratkaisu';const target=document.createElement('div');target.innerHTML=`<div class="feedback ${cls}"><b>${label}</b><p>${x[4]}</p></div><button class="primary" id="next">${x[5]?'Korjaa tilanne':'Jatka'}</button>`;app.appendChild(target);document.querySelector('#next').onclick=()=>x[5]?renderRepair(x[5]):next()}
function renderRepair(key){const r=repairs[key];app.innerHTML=`${meters()}<h2>Rajoita vahinko</h2><p class="lead">${r.q}</p><div class="choices">${r.a.map((x,j)=>`<button data-repair="${j}">${x[0]}</button>`).join('')}</div>`;document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>{const x=r.a[+b.dataset.repair];state.safety=clamp(state.safety+x[2]);document.querySelectorAll('[data-repair]').forEach(z=>z.disabled=true);app.insertAdjacentHTML('beforeend',`<div class="feedback ${x[2]>0?'good':'bad'}"><p>${x[1]}</p></div><button class="primary" id="cont">Jatka</button>`);document.querySelector('#cont').onclick=next})}
function next(){state.i++;state.locked=false;state.i<cases.length?renderCase():finish()}
function finish(){progress();document.querySelector('#progressBar').style.width='100%';let level=state.good>=5?'Toimit järjestelmällisesti':state.good>=3?'Perusajatus on hallussa':'Turvallinen tarkistaminen vaatii vielä harjoittelua';app.innerHTML=`<h2>Päivä selvitetty</h2><p class="lead"><b>${level}.</b></p><div class="summary"><div>🛡️ Turvallisuus<br><b>${state.safety}/100</b></div><div>🔎 Tarkkaavaisuus<br><b>${state.attention}/100</b></div><div>Riippumattomia tarkistuksia<br><b>${state.good}</b></div><div>Käytettyjä vihjeitä<br><b>${state.hints}</b></div></div><h3>Muista kolmivaiheinen toimintatapa</h3><ol><li><b>Pysähdy.</b> Kiire ja houkutteleva etu voivat olla vaikuttamiskeinoja.</li><li><b>Tarkista.</b> Avaa palvelu itse, käytä tuttua sovellusta tai varmista toisella yhteyskanavalla.</li><li><b>Suojaa.</b> Jos tietoja päätyi väärään paikkaan, vaihda tunnukset tai sulje kortti heti.</li></ol><p>Pistemäärä kuvaa vain tämän pelikerran valintoja. Voit pelata uudelleen ja kokeilla muita reittejä.</p><div class="choices"><button class="primary" onclick="start()">Pelaa uudelleen</button></div>`}
intro();
</script></body></html>
